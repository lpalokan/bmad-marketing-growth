code: marketing-growth
name: "Marketing Growth Suite"
description: "AI-powered go-to-market team for international B2B technology — a GTM orchestrator above two wings: marketing (CMO + 8 domain orchestrators + ~33 specialists) and sales prospecting (New-Business Orchestrator + 10 specialists), with brief-driven delegation (see docs/protocol.md). v2.1 integrated the Sales Prospecting Suite into one package; v2.2 consolidates overlapping specialists into a 39-agent roster; v2.4 fixes the folder names at output/ and input/ and drops the output-folder install question."
module_version: 2.4.0
default_selected: false

module_greeting: |
  Your AI go-to-market team is ready — one suite, two wings.

  **Don't know where to start?** Talk to Rae Revenue via
  /gtm-orchestrator — the one orchestrator aware of every orchestrator
  and agent in both wings. Rae routes any request, aligns marketing and
  sales on one account narrative, and owns the final escalation.

  **First run?** Start with /company-context-bootstrap to build the
  shared company-context/ OKF bundle (ICP, positioning, brand voice,
  KPIs, tech stack) — every marketing agent reads these on activation.
  Optionally run /sales-context-bootstrap to pre-seed the sales layer
  (offerings, scoring model, signal library, playbooks) — the sales
  wing works without it.

  GTM Orchestrator: gtm-orchestrator (Rae Revenue)
  Bootstrap: company-context-bootstrap · sales-context-bootstrap
  CMO: marketing-orchestrator (Max Growth)
  New Business: sales-prospecting-orchestrator (Sam Sell)
  Measurement & Attribution Staff: growth-analyst (Pixel Metrics)

  Domain orchestrators:
    product-marketing-orchestrator (Priya Position)
    digital-marketing-orchestrator (Dani Demand)
    growth-marketing-orchestrator (Greta Growth)
    brand-orchestrator (Brio Brand)
    content-architect (Milo Page)
    field-marketing-orchestrator (Frank Field)
    pr-comms-orchestrator (Penny PR)
    channel-partner-orchestrator (Charlie Channel)

  Specialists (by domain):
    PMM: positioning-messaging-pmm, competitive-intelligence-pmm, launch-sales-enablement-pmm, sales-presentation-advisor
    Digital: web-cro-specialist, paid-search-specialist, paid-social-demand-specialist, marketing-automation-engineer, technical-seo-engineer
    Growth: lifecycle-activation, experimentation-funnel-lead
    Brand: brand-narrative-strategist, localization-international-lead
    Content: content-seo-strategist, technical-content-writer
    Field: abm-strategist, events-webinars-producer, customer-advocacy-references, social-media-strategist (Nova — owns LinkedIn, YouTube, Twitter, Reddit)
    PR & Comms: media-relations-specialist, analyst-relations-specialist
    Channel: (none — Charlie Channel produces directly)

  Sales prospecting wing (under Sam Sell):
    account-sourcing-strategist (Tara Target — sourcing, tiering + fit/timing scoring),
    account-research-analyst (Remy Research — account profile + signals),
    service-offering-advisor (Otto Offer), buying-committee-mapper (Cleo Contact),
    contact-approach-writer (Aria Approach — messages + cadence),
    reply-objection-handler (Ricky Reply)
    Account storylines come from sales-presentation-advisor (Pierce Pitch).

  Workflows (Tier-1, v2): annual-planning, product-launch, content-pipeline (refreshed), paid-campaign-launch, experimentation-sprint, abm-program, growth-audit (refreshed)
  Workflows (Tier-2, v2): positioning-workshop, competitive-teardown, webinar-production, analyst-briefing, lifecycle-program-build, partner-co-marketing-campaign, localization-rollout, seo-sprint (refreshed)
  Workflow (kept from v1): marketing-strategy
  Sales workflow: account-dossier (the dossier standard + build workflow)
  Bootstraps: company-context-bootstrap, sales-context-bootstrap

# Install-time questions. On BMAD 6.x installers the answers flow into
# _bmad/marketing-growth/config.yaml (module config) and the root
# _bmad/config.toml / _bmad/config.user.toml per `user_setting`; legacy
# installers wrote _bmad/config.yaml (shared) / _bmad/config.user.yaml
# (personal, gitignored). Agents read all locations, newest layout first.
questions:
  - key: user_name
    prompt: "What name should the agents use when addressing you?"
    default: "BMad"
    user_setting: true

  - key: communication_language
    prompt: "What language do you want agents to communicate with you in?"
    default: "English"
    user_setting: true

  - key: document_output_language
    prompt: "What language should generated documents be written in?"
    default: "English"
    user_setting: false

# Folder names are FIXED, not asked at install: generated documents go to
# {project-root}/output and the INGEST drop folder is {project-root}/input.
# There is deliberately no question here — one less prompt, and nothing for the
# installer to remember and drift on across upgrades.
#
# Compatibility: agents still READ an `output_folder` / `input_folder` key if an
# older config supplies one, and still read a legacy `_bmad-output/` (or
# `_bmad-input/`) folder that already holds content. They never create either.
# See the resolution rule in docs/on-activation-template.md.
directories:
  - "{project-root}/output"
  - "{project-root}/input"

# Agent roster — consumed by bmad-module-builder validation and any UI that
# lists installed agents. Derived from each agent's customize.toml [agent] block.
agents:
  # GTM top-level orchestrator — aware of every orchestrator and agent in both wings
  - code: gtm-orchestrator
    name: "Rae Revenue"
    title: "Go-to-Market Orchestrator"
    icon: "🧭"
    description: "Go-to-Market Orchestrator who sits above the CMO (Max Growth) and the New-Business Orchestrator (Sam Sell), routes any request to the right orchestrator or specialist across both wings, aligns marketing and sales motions on one account narrative, and is the final escalation path before the user."

  # CMO + Staff
  - code: marketing-orchestrator
    name: "Max Growth"
    title: "CMO Orchestrator"
    icon: "🎯"
    description: "CMO Orchestrator who sets global strategy, sequences campaigns across the 8 domain orchestrators, owns the annual plan, and is the explicit escalation path for ESCALATED briefs."
  - code: growth-analyst
    name: "Pixel Metrics"
    title: "Measurement & Attribution Staff"
    icon: "📊"
    description: "Measurement & Attribution Staff who owns kpis.md, designs attribution models, forecasts, dashboards, and scoring-model design. MarOps implementation moved out to Marketing Automation Engineer in v2."

  # v2 — Product Marketing
  - code: product-marketing-orchestrator
